[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-ai"
version = "1.0.0"
description = "Phishing Website Detection Using URL-Based Feature Extraction with Decision Tree and Random Forest Algorithms"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.24.3,<2.0.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "streamlit>=1.32.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "pytest>=7.4.0",
    "python-dotenv>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
